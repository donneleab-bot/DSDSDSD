<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFF — Саванна</title>
    <style>
        :root {
            --pixel-size: 2px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100vw;
            height: 100vh;
            padding: 8px;
        }

        /* Окно просмотра карты */
        .viewport {
            width: 100%;
            max-width: 900px;
            height: 65vh;
            border: 4px solid #3a2a0a;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            cursor: grab;
            box-shadow: 
                0 0 0 2px #1a0a00,
                0 0 0 6px #5a3a0a,
                0 10px 40px rgba(0,0,0,0.8);
            background: #1a0a00;
        }

        .viewport:active {
            cursor: grabbing;
        }

        .viewport.grabbing {
            cursor: grabbing;
        }

        /* Огромная пиксельная карта */
        .world-map {
            position: absolute;
            width: 3200px;
            height: 2000px;
            background: #c4a44a;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transition: none;
        }

        /* Слой земли */
        .ground-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    0deg,
                    #c4a44a 0px,
                    #b8942e 4px,
                    #c4a44a 8px
                ),
                repeating-linear-gradient(
                    90deg,
                    #c4a44a 0px,
                    #b8942e 3px,
                    #c4a44a 6px
                );
            background-blend-mode: overlay;
        }

        /* Трава пиксельная */
        .grass-pixel {
            position: absolute;
            image-rendering: pixelated;
            pointer-events: none;
        }

        .grass-tile {
            position: absolute;
            width: 16px;
            height: 16px;
            image-rendering: pixelated;
            background: 
                linear-gradient(180deg, 
                    #3a7a20 0%, #3a7a20 25%,
                    #2d6a18 25%, #2d6a18 50%,
                    #1a5a0a 50%, #1a5a0a 75%,
                    #0a4a00 75%, #0a4a00 100%);
            clip-path: polygon(
                50% 0%, 75% 25%, 100% 25%, 
                87% 50%, 100% 75%, 75% 75%,
                50% 100%, 25% 75%, 0% 75%,
                12% 50%, 0% 25%, 25% 25%
            );
            pointer-events: none;
        }

        /* Деревья пиксельные */
        .pixel-tree {
            position: absolute;
            pointer-events: none;
            image-rendering: pixelated;
        }
        .pixel-tree .trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: #6b4a2a;
            box-shadow: 
                1px 0 0 #5a3a1a,
                -1px 0 0 #7a5a3a;
        }
        .pixel-tree .crown {
            position: absolute;
            background: #2a6a0a;
            box-shadow: 
                2px 2px 0 #1a5a00,
                4px 0 0 #3a7a10,
                -2px 2px 0 #1a4a00,
                0 4px 0 #2a5a0a;
        }

        /* Река пиксельная */
        .pixel-river {
            position: absolute;
            image-rendering: pixelated;
            pointer-events: none;
        }
        .river-segment {
            position: absolute;
            background: #4a90d9;
            image-rendering: pixelated;
            box-shadow: 
                inset 2px 0 0 #3a70b9,
                inset -2px 0 0 #5aa0e9,
                inset 0 2px 0 #6ab0f9,
                inset 0 -2px 0 #2a5a9a;
        }
        .river-shimmer {
            position: absolute;
            background: rgba(255,255,255,0.4);
            animation: pixelShimmer 3s steps(4) infinite;
            pointer-events: none;
        }
        @keyframes pixelShimmer {
            0%, 100% { opacity: 0.2; transform: translateX(0); }
            50% { opacity: 0.6; transform: translateX(8px); }
        }

        /* Камни */
        .pixel-rock {
            position: absolute;
            background: #8a8a7a;
            image-rendering: pixelated;
            box-shadow: 
                1px 1px 0 #6a6a5a,
                -1px -1px 0 #aaaa9a,
                2px 2px 0 #5a5a4a;
            pointer-events: auto;
            cursor: pointer;
        }
        .pixel-rock.sleep-rock {
            background: #9a9a8a;
            box-shadow: 
                1px 1px 0 #7a7a6a,
                -1px -1px 0 #baba9a,
                2px 2px 0 #6a6a5a,
                0 0 8px rgba(255,200,100,0.3);
        }
        .pixel-rock.sleep-rock:hover {
            box-shadow: 
                1px 1px 0 #7a7a6a,
                -1px -1px 0 #baba9a,
                2px 2px 0 #6a6a5a,
                0 0 16px rgba(255,200,100,0.6);
        }

        /* Персонаж */
        .character {
            position: absolute;
            z-index: 50;
            pointer-events: none;
            width: 64px;
            height: 64px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transition: left 0.12s ease-out, top 0.12s ease-out;
        }
        .character img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.5));
        }
        .character.flip img {
            transform: scaleX(-1);
        }

        /* Эмоция над головой */
        .emote-badge {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            pointer-events: none;
            z-index: 51;
            animation: emoteBounce 0.8s steps(3) infinite;
            image-rendering: pixelated;
        }
        @keyframes emoteBounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-6px); }
        }

        /* Анимации персонажа */
        .character.chasing { animation: chaseAnim 0.35s steps(3) infinite; }
        .character.eating { animation: eatAnim 0.5s steps(3); }
        .character.angry img { animation: angryAnim 0.4s steps(3) infinite; filter: drop-shadow(3px 3px 0 rgba(255,0,0,0.6)) brightness(1.3) !important; }
        .character.hunting { animation: huntAnim 0.7s steps(4); }
        .character.sleeping { animation: sleepAnim 2s steps(4) infinite; filter: brightness(0.7) saturate(0.6); }
        .character.avoiding { animation: avoidAnim 0.3s steps(2) infinite; }
        .character.curious { animation: curiousAnim 0.8s steps(4) infinite; }
        .character.annoyed { animation: annoyedAnim 0.2s steps(2) infinite; }

        @keyframes chaseAnim {
            0% { transform: translateY(0); }
            33% { transform: translateY(-6px); }
            66% { transform: translateY(-3px); }
            100% { transform: translateY(0); }
        }
        @keyframes eatAnim {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        @keyframes angryAnim {
            0% { transform: translateX(0) rotate(0deg); }
            33% { transform: translateX(-6px) rotate(-3deg); }
            66% { transform: translateX(6px) rotate(3deg); }
            100% { transform: translateX(0) rotate(0deg); }
        }
        @keyframes huntAnim {
            0% { transform: scale(1,1); }
            30% { transform: scale(0.8,1.1); }
            60% { transform: scale(1.2,0.9) translateY(-20px); }
            100% { transform: scale(1,1) translateY(0); }
        }
        @keyframes sleepAnim {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        @keyframes avoidAnim {
            0% { transform: translateX(0); }
            100% { transform: translateX(10px); }
        }
        @keyframes curiousAnim {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes annoyedAnim {
            0% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(-4px) rotate(-2deg); }
            100% { transform: translateX(0) rotate(0deg); }
        }

        /* Добыча */
        .prey-sprite {
            position: absolute;
            font-size: 24px;
            pointer-events: auto;
            z-index: 30;
            cursor: pointer;
            image-rendering: pixelated;
            animation: preyWander 4s steps(6) infinite;
            filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.4));
        }
        .prey-sprite:hover { transform: scale(1.3); }
        .prey-sprite.fleeing {
            animation: fleeFast 0.8s steps(5) forwards;
            pointer-events: auto;
            cursor: crosshair;
        }
        .prey-sprite.caught {
            animation: caughtDie 0.5s steps(3) forwards;
            pointer-events: none;
        }
        @keyframes preyWander {
            0% { transform: translate(0,0); }
            25% { transform: translate(40px,-20px); }
            50% { transform: translate(20px,-10px); }
            75% { transform: translate(-30px,-25px); }
            100% { transform: translate(0,0); }
        }
        @keyframes fleeFast {
            0% { transform: translate(0,0) scale(1); opacity: 1; }
            30% { transform: translate(var(--fx),var(--fy)) scale(1.1); opacity: 1; }
            100% { transform: translate(calc(var(--fx)*3),calc(var(--fy)*3)) scale(0.5); opacity: 0.5; }
        }
        @keyframes caughtDie {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0) translateY(-30px); }
        }

        /* Мясо */
        .meat-drop {
            position: absolute;
            font-size: 22px;
            z-index: 28;
            pointer-events: auto;
            cursor: pointer;
            image-rendering: pixelated;
            animation: meatFall 0.4s steps(4) ease-out;
            filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.5));
        }
        .meat-drop:hover {
            transform: scale(1.4);
            filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.7)) brightness(1.3);
        }
        @keyframes meatFall {
            0% { transform: translateY(-40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Панель статуса */
        .stats-panel {
            background: #1a1a2e;
            border: 3px solid #3a2a0a;
            padding: 12px 20px;
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            image-rendering: pixelated;
        }
        .stat {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .stat-label {
            color: #aaa;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .stat-bar-outer {
            height: 8px;
            background: #1a1a3a;
            border: 1px solid #3a3a5c;
            image-rendering: pixelated;
        }
        .stat-bar-inner {
            height: 100%;
            transition: width 0.4s steps(8);
            image-rendering: pixelated;
        }
        .stat-bar-inner.hunger { background: #e94560; box-shadow: 0 0 4px #e94560; }
        .stat-bar-inner.energy { background: #4ecdc4; box-shadow: 0 0 4px #4ecdc4; }
        .stat-bar-inner.mood { background: #ffd93d; box-shadow: 0 0 4px #ffd93d; }
        .stat-num {
            color: #e0e0e0;
            font-size: 12px;
            font-weight: bold;
        }

        /* Кнопки */
        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background: #1a1a2e;
            color: #e0e0e0;
            border: 2px solid #3a3a5c;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            image-rendering: pixelated;
            transition: all 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            background: #2a2a4e;
            border-color: #5a5a8c;
            transform: translateY(-2px);
        }
        .btn:active { transform: translateY(0); }
        .btn.hunt { border-color: #ff6b6b; background: #2a1018; }
        .btn.hunt.on { border-color: #ff3333; background: #3a1520; box-shadow: 0 0 12px rgba(255,0,0,0.3); }

        /* Облачка сообщений */
        .msg-bubble {
            position: absolute;
            background: #fff;
            color: #1a1a2e;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: bold;
            z-index: 60;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            image-rendering: pixelated;
            animation: msgUp 2s steps(8) forwards;
            white-space: nowrap;
            border: 2px solid #ccc;
        }
        @keyframes msgUp {
            0% { opacity: 0; transform: translateY(8px); }
            15% { opacity: 1; transform: translateY(-15px); }
            80% { opacity: 1; transform: translateY(-35px); }
            100% { opacity: 0; transform: translateY(-60px); }
        }

        /* Память */
        .mem-bar {
            background: #1a1a2e;
            border: 2px solid #3a2a0a;
            padding: 8px 15px;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            font-size: 10px;
            max-height: 55px;
            overflow-y: auto;
            image-rendering: pixelated;
        }
        .mem-tag {
            background: #2a2a4a;
            padding: 2px 6px;
            font-size: 10px;
            color: #aaa;
            font-family: 'Courier New', monospace;
        }
        .mem-tag.alert {
            background: #3a1a2a;
            color: #ff6b6b;
            border: 1px solid #5a2a3a;
        }

        .title {
            color: #d4a574;
            font-size: 18px;
            letter-spacing: 3px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px rgba(212,167,116,0.4);
            image-rendering: pixelated;
        }

        .fallback-emoji {
            font-size: 50px;
            display: none;
            position: absolute;
        }

        @media (max-width: 950px) {
            .viewport { height: 50vh; }
            .btn { padding: 6px 10px; font-size: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">▲ FFF — САВАННА ▲</div>

        <!-- Вьюпорт -->
        <div class="viewport" id="viewport">
            <div class="world-map" id="worldMap">
                <!-- Карта генерируется в JS -->
            </div>
            <div class="character" id="character">
                <img src="FFF.png" alt="FFF" id="charImg" onerror="onImgErr()">
                <span class="fallback-emoji" id="fbEmoji">🦁</span>
                <div class="emote-badge" id="emoteBadge"></div>
            </div>
        </div>

        <!-- Статус -->
        <div class="stats-panel">
            <div class="stat">
                <div class="stat-label">◄ ГОЛОД ►</div>
                <div class="stat-bar-outer"><div class="stat-bar-inner hunger" id="hungerBar" style="width:70%"></div></div>
                <div class="stat-num" id="hungerVal">70%</div>
            </div>
            <div class="stat">
                <div class="stat-label">◄ ЭНЕРГИЯ ►</div>
                <div class="stat-bar-outer"><div class="stat-bar-inner energy" id="energyBar" style="width:80%"></div></div>
                <div class="stat-num" id="energyVal">80%</div>
            </div>
            <div class="stat">
                <div class="stat-label">◄ НАСТРОЕНИЕ ►</div>
                <div class="stat-bar-outer"><div class="stat-bar-inner mood" id="moodBar" style="width:40%"></div></div>
                <div class="stat-num" id="moodVal">40%</div>
            </div>
        </div>

        <!-- Кнопки -->
        <div class="btn-row">
            <button class="btn" onclick="pet()">✋ ГЛАДИТЬ</button>
            <button class="btn" onclick="feed()">🍖 КОРМИТЬ</button>
            <button class="btn" onclick="play()">🎾 ИГРАТЬ</button>
            <button class="btn hunt" id="huntBtn" onclick="toggleHunt()">⚔ ОХОТА</button>
            <button class="btn" onclick="goSleep()">💤 СПАТЬ</button>
        </div>

        <!-- Память -->
        <div class="mem-bar" id="memBar">
            <span style="color:#666;">ПАМЯТЬ:</span>
        </div>
    </div>

    <script>
        // ===== ОШИБКА КАРТИНКИ =====
        function onImgErr() {
            document.getElementById('charImg').style.display = 'none';
            document.getElementById('fbEmoji').style.display = 'block';
        }

        // ===== КАРТА =====
        const MAP_W = 3200, MAP_H = 2000;
        const worldMap = document.getElementById('worldMap');
        const viewport = document.getElementById('viewport');

        function buildPixelMap() {
            let html = '';

            // Трава
            for (let i = 0; i < 300; i++) {
                const gx = Math.floor(Math.random() * MAP_W / 16) * 16;
                const gy = Math.floor(Math.random() * MAP_H / 16) * 16;
                html += `<div class="grass-tile" style="left:${gx}px;top:${gy}px;"></div>`;
            }

            // Деревья
            const trees = [];
            for (let i = 0; i < 35; i++) {
                const tx = 40 + Math.random() * (MAP_W - 200);
                const ty = 20 + Math.random() * (MAP_H - 200);
                const th = 80 + Math.random() * 120;
                trees.push({x:tx, y:ty, h:th});
            }
            trees.forEach(t => {
                html += `
                <div class="pixel-tree" style="left:${t.x}px;top:${t.y}px;width:${t.h*0.5}px;height:${t.h}px;">
                    <div class="trunk" style="width:12px;height:${t.h*0.35}px;"></div>
                    <div class="crown" style="width:${t.h*0.45}px;height:${t.h*0.5}px;top:0;left:50%;transform:translateX(-50%);"></div>
                </div>`;
            });

            // Река
            html += `
            <div class="pixel-river" style="left:600px;top:0;width:100px;height:1200px;">
                <div class="river-segment" style="width:100px;height:1200px;"></div>
                <div class="river-shimmer" style="left:15px;top:100px;width:50px;height:10px;"></div>
                <div class="river-shimmer" style="left:20px;top:400px;width:45px;height:10px;animation-delay:1s;"></div>
                <div class="river-shimmer" style="left:10px;top:700px;width:55px;height:10px;animation-delay:2s;"></div>
            </div>
            <div class="pixel-river" style="left:660px;top:1150px;width:600px;height:70px;">
                <div class="river-segment" style="width:600px;height:70px;border-radius:0 20px 20px 0;"></div>
                <div class="river-shimmer" style="left:50px;top:25px;width:80px;height:10px;"></div>
            </div>
            <div class="pixel-river" style="left:1200px;top:1050px;width:80px;height:400px;">
                <div class="river-segment" style="width:80px;height:400px;"></div>
            </div>`;

            // Камни
            const sleepRocks = [
                {x:900, y:400, w:90, h:55},
                {x:1800, y:300, w:100, h:60},
                {x:2200, y:800, w:85, h:50},
                {x:400, y:1000, w:95, h:58},
            ];
            sleepRocks.forEach((r, i) => {
                html += `<div class="pixel-rock sleep-rock" data-sleep="${i}" 
                    style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;"
                    onclick="clickSleepRock(${i},${r.x},${r.y})"></div>`;
            });

            for (let i = 0; i < 40; i++) {
                const rx = Math.random() * MAP_W;
                const ry = Math.random() * MAP_H;
                const rw = 20 + Math.random() * 40;
                html += `<div class="pixel-rock" style="left:${rx}px;top:${ry}px;width:${rw}px;height:${rw*0.6}px;"></div>`;
            }

            worldMap.innerHTML = html;
        }

        // ===== СКРОЛЛИНГ КАРТЫ =====
        let camX = 800, camY = 500;
        let isDragging = false, dragStartX, dragStartY, camStartX, camStartY;

        function updateCamera() {
            const vw = viewport.clientWidth;
            const vh = viewport.clientHeight;
            camX = Math.max(0, Math.min(MAP_W - vw, camX));
            camY = Math.max(0, Math.min(MAP_H - vh, camY));
            worldMap.style.transform = `translate(${-camX}px, ${-camY}px)`;
        }

        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('.pixel-rock') || e.target.closest('.prey-sprite') || 
                e.target.closest('.meat-drop') || e.target.closest('button')) return;
            isDragging = true;
            viewport.classList.add('grabbing');
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            camStartX = camX;
            camStartY = camY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            camX = camStartX + (dragStartX - e.clientX);
            camY = camStartY + (dragStartY - e.clientY);
            updateCamera();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            viewport.classList.remove('grabbing');
        });

        // Тач
        viewport.addEventListener('touchstart', (e) => {
            if (e.target.closest('.pixel-rock') || e.target.closest('.prey-sprite') || 
                e.target.closest('.meat-drop')) return;
            isDragging = true;
            dragStartX = e.touches[0].clientX;
            dragStartY = e.touches[0].clientY;
            camStartX = camX;
            camStartY = camY;
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            camX = camStartX + (dragStartX - e.touches[0].clientX);
            camY = camStartY + (dragStartY - e.touches[0].clientY);
            updateCamera();
        });
        window.addEventListener('touchend', () => { isDragging = false; });

        // ===== СОСТОЯНИЕ =====
        const S = {
            hunger: 70, energy: 80, mood: 40,
            hunt: false, chase: false, sleep: false,
            emotion: '😼', memory: [],
            preyList: [], meatList: [],
            huntStamina: 100,
        };

        const charEl = document.getElementById('character');
        const emoteBadge = document.getElementById('emoteBadge');
        const huntBtn = document.getElementById('huntBtn');
        const memBar = document.getElementById('memBar');

        let charX = 1200, charY = 600;
        let targetX = 1200, targetY = 600;
        let mouseMapX = 1200, mouseMapY = 600;

        // ===== ЭМОЦИИ =====
        function setEmote(emoji) {
            S.emotion = emoji;
            emoteBadge.textContent = emoji;
        }

        function updateEmote() {
            charEl.classList.remove('chasing','eating','angry','hunting','sleeping','avoiding','curious','annoyed');
            if (S.sleep) { charEl.classList.add('sleeping'); setEmote('💤'); return; }
            
            if (S.mood >= 80) { setEmote('😸'); charEl.classList.add('curious'); }
            else if (S.mood >= 60) { setEmote('😼'); }
            else if (S.mood >= 40) { setEmote('😾'); if(S.mood<=50) charEl.classList.add('avoiding'); }
            else if (S.mood >= 20) { setEmote('😡'); charEl.classList.add('annoyed'); charEl.classList.add('avoiding'); }
            else { setEmote('🤬'); charEl.classList.add('angry'); charEl.classList.add('avoiding'); }
            
            if (S.hunger>80 && S.mood<50) { setEmote('😤'); charEl.classList.add('angry'); }
            if (S.energy<20) setEmote('😩');
        }

        // ===== СТАТУСЫ =====
        function updStats() {
            S.hunger = Math.max(0,Math.min(100,S.hunger));
            S.energy = Math.max(0,Math.min(100,S.energy));
            S.mood = Math.max(0,Math.min(100,S.mood));
            document.getElementById('hungerBar').style.width = S.hunger+'%';
            document.getElementById('energyBar').style.width = S.energy+'%';
            document.getElementById('moodBar').style.width = S.mood+'%';
            document.getElementById('hungerVal').textContent = Math.round(S.hunger)+'%';
            document.getElementById('energyVal').textContent = Math.round(S.energy)+'%';
            document.getElementById('moodVal').textContent = Math.round(S.mood)+'%';
            updateEmote();

            if (S.mood<=50 && !S.sleep && !S.hunt && !S.chase) {
                const dx=mouseMapX-charX, dy=mouseMapY-charY;
                const dist=Math.sqrt(dx*dx+dy*dy);
                if(dist<120){targetX=charX-(dx/dist)*130; targetY=charY-(dy/dist)*130;}
            }
            if(S.hunger>80 && S.mood<30 && S.energy>25 && !S.sleep && !S.hunt) startChase();
        }

        // ===== ПАМЯТЬ =====
        function addMem(act, warn=false) {
            const t=new Date().toLocaleTimeString();
            const e=`${t}: ${act}`;
            if(S.memory.length>0 && S.memory[S.memory.length-1].includes(act)) return;
            S.memory.push(e);
            if(S.memory.length>20) S.memory.shift();
            memBar.innerHTML='<span style="color:#666;">ПАМЯТЬ:</span> '+
                S.memory.slice(-8).map(m=>`<span class="mem-tag${warn?' alert':''}">${m}</span>`).join('');
        }

        // ===== СООБЩЕНИЯ =====
        function showMsg(text, x, y) {
            const b=document.createElement('div');
            b.className='msg-bubble';
            b.textContent=text;
            b.style.left=Math.max(5,Math.min(MAP_W-100,x-camX))+'px';
            b.style.top=Math.max(5,y-camY-20)+'px';
            viewport.appendChild(b);
            setTimeout(()=>b.remove(),2000);
        }

        // ===== ДВИЖЕНИЕ =====
        function moveChar() {
            if(S.sleep){ requestAnimationFrame(moveChar); return; }
            const mx=MAP_W-40, my=MAP_H-50, mn=20;
            if(S.chase && !S.sleep){
                targetX=mouseMapX-32; targetY=mouseMapY-40;
            }
            targetX=Math.max(mn,Math.min(mx,targetX));
            targetY=Math.max(mn,Math.min(my,targetY));
            const sp=S.chase?0.08:0.04;
            charX+=(targetX-charX)*sp;
            charY+=(targetY-charY)*sp;
            const dx=targetX-charX;
            if(Math.abs(dx)>2) charEl.classList.toggle('flip',dx<0);
            charEl.style.left=(charX-camX)+'px';
            charEl.style.top=(charY-camY)+'px';
            requestAnimationFrame(moveChar);
        }

        // ===== ПОГОНЯ =====
        function startChase(){ if(S.chase||S.sleep)return; S.chase=true; charEl.classList.add('chasing'); addMem('ГОНИТСЯ!',true); }
        function stopChase(){ S.chase=false; charEl.classList.remove('chasing'); }

        // ===== СОН =====
        function goSleep(){
            if(S.sleep){ wakeUp(); return; }
            if(S.energy>80){ showMsg('НЕ ХОЧУ!',charX,charY-20); return; }
            S.sleep=true; charEl.classList.add('sleeping'); setEmote('💤'); stopChase();
            addMem('УСНУЛ'); showMsg('Zzz...',charX,charY-20);
            document.querySelector('.btn:nth-child(5)').textContent='☀ ПРОСНУТЬСЯ';
            setTimeout(wakeUp,20000);
        }
        function clickSleepRock(i,rx,ry){ targetX=rx+20; targetY=ry+10; setTimeout(goSleep,500); }
        function wakeUp(){
            S.sleep=false; charEl.classList.remove('sleeping');
            S.energy=Math.min(100,S.energy+45); S.mood=Math.min(100,S.mood+18);
            addMem('ПРОСНУЛСЯ'); showMsg('ЛАДНО...',charX,charY-20);
            document.querySelector('.btn:nth-child(5)').textContent='💤 СПАТЬ';
            updStats();
        }

        // ===== ОХОТА (УСЛОЖНЁННАЯ) =====
        const PREY = ['🐔','🐑','🐇','🦆','🐖','🐄','🦌','🐐'];
        let huntInterval;

        function spawnPrey(){
            if(!S.hunt||S.sleep||S.preyList.length>=6) return;
            const p=document.createElement('div');
            p.className='prey-sprite';
            p.textContent=PREY[Math.floor(Math.random()*PREY.length)];
            const px=100+Math.random()*(MAP_W-300), py=80+Math.random()*(MAP_H-250);
            p.style.left=px+'px'; p.style.top=py+'px';
            p.style.animationDuration=(3+Math.random()*5)+'s';
            p.dataset.x=px; p.dataset.y=py;
            p.dataset.clicks=0;
            p.addEventListener('click',(e)=>{ e.stopPropagation(); huntPrey(p); });
            worldMap.appendChild(p);
            S.preyList.push(p);
            setTimeout(()=>{ if(p.parentNode&&!p.classList.contains('caught')){p.remove(); S.preyList=S.preyList.filter(x=>x!==p);} },10000);
        }

        function huntPrey(prey){
            if(!S.hunt||S.sleep||prey.classList.contains('caught')) return;
            const clicks=parseInt(prey.dataset.clicks)+1;
            prey.dataset.clicks=clicks;

            if(clicks===1){
                // Первое нажатие — жертва убегает
                prey.classList.add('fleeing');
                const fx=(Math.random()-0.5)*300, fy=(Math.random()-0.5)*300;
                prey.style.setProperty('--fx',fx+'px');
                prey.style.setProperty('--fy',fy+'px');
                const nx=parseFloat(prey.dataset.x)+fx, ny=parseFloat(prey.dataset.y)+fy;
                prey.dataset.x=nx; prey.dataset.y=ny;
                S.huntStamina=Math.max(0,S.huntStamina-20);
                showMsg('УБЕГАЕТ! ЖМИ ЕЩЁ!',charX,charY-20);
                targetX=nx; targetY=ny;
                setTimeout(()=>{ prey.classList.remove('fleeing'); },800);
            } else if(clicks>=2){
                // Второе нажатие — поймали
                prey.classList.add('caught');
                const mx=parseFloat(prey.dataset.x), my=parseFloat(prey.dataset.y);
                const meat=document.createElement('div');
                meat.className='meat-drop';
                meat.textContent='🥩';
                meat.style.left=mx+'px'; meat.style.top=my+'px';
                meat.addEventListener('click',(e)=>{e.stopPropagation(); eatMeat(meat);});
                worldMap.appendChild(meat);
                S.meatList.push(meat);
                S.mood=Math.min(100,S.mood+18);
                addMem('ПОЙМАЛ!');
                showMsg('ПОПАЛСЯ!',mx,my-20);
                setTimeout(()=>{prey.remove(); S.preyList=S.preyList.filter(x=>x!==prey);},500);
                charEl.classList.add('hunting');
                setTimeout(()=>charEl.classList.remove('hunting'),700);
            }
            updStats();
        }

        function eatMeat(meat){
            if(!meat.parentNode||S.sleep) return;
            const mx=parseFloat(meat.style.left), my=parseFloat(meat.style.top);
            targetX=mx; targetY=my;
            setTimeout(()=>{
                charEl.classList.add('eating');
                meat.remove(); S.meatList=S.meatList.filter(m=>m!==meat);
                S.hunger=Math.max(0,S.hunger-25); S.energy=Math.min(100,S.energy+10); S.mood=Math.min(100,S.mood+12);
                addMem('СЪЕЛ МЯСО'); showMsg('ВКУСНО!',mx,my-20);
                updStats();
                setTimeout(()=>charEl.classList.remove('eating'),400);
            },300);
        }

        function toggleHunt(){
            if(S.sleep){ showMsg('Zzz...',charX,charY-20); return; }
            S.hunt=!S.hunt;
            if(S.hunt){
                huntBtn.textContent='⚔ ОХОТА ON'; huntBtn.classList.add('on');
                stopChase(); S.huntStamina=100;
                addMem('ОХОТА!'); showMsg('ВРЕМЯ ОХОТЫ!',charX,charY-20);
                huntInterval=setInterval(spawnPrey,2000);
                spawnPrey();
            } else {
                huntBtn.textContent='⚔ ОХОТА'; huntBtn.classList.remove('on');
                clearInterval(huntInterval);
                S.preyList.forEach(p=>p.remove()); S.preyList=[];
                S.meatList.forEach(m=>m.remove()); S.meatList=[];
                addMem('ОХОТА КОНЧИЛАСЬ');
                updStats();
            }
        }

        // ===== ВЗАИМОДЕЙСТВИЯ =====
        function pet(){
            if(S.sleep){ showMsg('Zzz...',charX,charY-20); return; }
            if(S.mood<30){ showMsg('НЕ ТРОГАЙ!',charX,charY-20); targetX=charX+(Math.random()-0.5)*200; targetY=charY+(Math.random()-0.5)*150; S.mood=Math.max(0,S.mood-10); addMem('УДАРИЛ',true); }
            else if(S.mood<60){ showMsg('ЛАДНО...',charX,charY-20); S.mood=Math.min(100,S.mood+5); S.energy=Math.max(0,S.energy-5); addMem('ТЕРПЕЛ'); }
            else { showMsg('МРР...',charX,charY-20); S.mood=Math.min(100,S.mood+8); addMem('ПОНРАВИЛОСЬ'); }
            updStats();
        }
        function feed(){
            if(S.sleep){ showMsg('Zzz...',charX,charY-20); return; }
            const meat=document.createElement('div');
            meat.className='meat-drop'; meat.textContent='🥩';
            meat.style.left=(charX+20)+'px'; meat.style.top=(charY+20)+'px';
            meat.addEventListener('click',(e)=>{e.stopPropagation(); eatMeat(meat);});
            worldMap.appendChild(meat); S.meatList.push(meat);
            showMsg('ДЕРЖИ',charX,charY-20); addMem('ПОЛУЧИЛ МЯСО');
            setTimeout(()=>{if(meat.parentNode)eatMeat(meat);},2000);
        }
        function play(){
            if(S.sleep){ showMsg('Zzz...',charX,charY-20); return; }
            if(S.energy<15){ showMsg('УСТАЛ...',charX,charY-20); addMem('ОТКАЗАЛСЯ'); return; }
            targetX=Math.random()*(MAP_W-200)+100; targetY=Math.random()*(MAP_H-200)+80;
            S.energy=Math.max(0,S.energy-15); S.mood=Math.min(100,S.mood+(S.mood<50?5:12));
            showMsg('ДОГОНЯЙ!',charX,charY-20); addMem('ИГРАЛ'); updStats();
        }

        // ===== МЫШЬ ДЛЯ КАРТЫ =====
        viewport.addEventListener('mousemove', (e) => {
            if(isDragging) return;
            const r=viewport.getBoundingClientRect();
            mouseMapX=e.clientX-r.left+camX;
            mouseMapY=e.clientY-r.top+camY;
        });

        viewport.addEventListener('click', (e) => {
            if(isDragging) return;
            if(e.target===viewport||e.target===worldMap||e.target.classList.contains('ground-layer')){
                if(S.chase && !S.hunt){ stopChase(); showMsg('НАДОЕЛО...',charX,charY-20); }
            }
        });

        // ===== ПАССИВ =====
        setInterval(()=>{
            if(S.sleep){ S.energy=Math.min(100,S.energy+1.5); S.hunger=Math.min(100,S.hunger+0.15); S.mood=Math.min(100,S.mood+0.3); updStats(); return; }
            S.hunger=Math.min(100,S.hunger+0.5);
            if(!S.hunt&&!S.chase) S.energy=Math.min(100,S.energy+0.2);
            if(S.hunt) S.energy=Math.max(0,S.energy-0.35);
            if(S.chase) S.energy=Math.max(0,S.energy-0.3);
            if(S.hunger>70) S.mood=Math.max(0,S.mood-0.25);
            if(S.energy<15) S.mood=Math.max(0,S.mood-0.35);
            if(S.hunger>85&&!S.chase&&S.energy>20&&!S.sleep&&S.mood<35) startChase();
            if(S.energy<5&&S.chase){ stopChase(); showMsg('ВЫДОХСЯ...',charX,charY-20); }
            updStats();
        },2000);

        // ===== СТАРТ =====
        function init(){
            buildPixelMap();
            charEl.style.left=(charX-camX)+'px';
            charEl.style.top=(charY-camY)+'px';
            setEmote('😼');
            updateCamera();
            moveChar();
            addMem('ПОЯВИЛСЯ');
            updStats();
            setTimeout(()=>showMsg('ЧТО СМОТРИШЬ?',charX,charY-20),1500);
        }

        window.addEventListener('beforeunload',()=>{
            try{sessionStorage.setItem('fff_save',JSON.stringify({h:S.hunger,e:S.energy,m:S.mood,mem:S.memory.slice(-10)}));}catch(e){}
        });
        try{
            const sv=sessionStorage.getItem('fff_save');
            if(sv){ const d=JSON.parse(sv); S.hunger=d.h||70; S.energy=d.e||80; S.mood=d.m||40; if(d.mem)S.memory=d.mem; }
        }catch(e){}

        init();
        console.log('🦁 FFF — САВАННА ЗАГРУЖЕНА');
    </script>
</body>
</html>
