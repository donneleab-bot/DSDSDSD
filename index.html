<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Надменный Лев — Саванна</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #1a1a2e;
            --text: #e0e0e0;
            --accent: #e94560;
            --gold: #d4a574;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a14;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            width: 100vw;
            height: 100vh;
            padding: 10px;
        }

        /* Огромная игровая зона с прокруткой */
        .game-world {
            width: 100%;
            max-width: 1400px;
            height: 70vh;
            border-radius: 20px;
            border: 4px solid #2a1f0a;
            position: relative;
            overflow: hidden;
            cursor: grab;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 0 100px rgba(0,0,0,0.3);
        }

        .game-world:active {
            cursor: grabbing;
        }

        /* Огромная карта внутри */
        .map-container {
            position: absolute;
            width: 2400px;
            height: 1600px;
            background: #1a3a0a;
            transition: transform 0.1s ease-out;
            image-rendering: auto;
        }

        /* Слои карты */
        .terrain-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Базовая земля */
        .ground-savanna {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 30%, #c4a44a 0%, #8b6914 40%, #5a4a0a 100%),
                radial-gradient(ellipse at 70% 60%, #b8952e 0%, #7a5c10 50%, #4a3508 100%),
                radial-gradient(ellipse at 50% 20%, #d4b44a 0%, #9b7920 60%, #5a4a0a 100%);
            background-blend-mode: multiply;
        }

        /* Трава */
        .grass-patch {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #4a8c2a 0%, #2d5a18 40%, transparent 70%);
            opacity: 0.8;
        }

        .grass-tall {
            position: absolute;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 8px,
                #3a7a20 8px,
                #3a7a20 10px
            );
            border-radius: 50% 50% 0 0;
            opacity: 0.7;
        }

        /* Деревья */
        .tree {
            position: absolute;
            z-index: 5;
            pointer-events: none;
        }

        .tree-trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #6b4a2a, #4a2a10);
            border-radius: 5px 5px 0 0;
        }

        .tree-crown {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 30%, #4a9a2a, #1a5a0a);
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.4), 0 10px 20px rgba(0,0,0,0.3);
        }

        .tree-crown.acacia {
            background: radial-gradient(ellipse at 50% 60%, #6a9a3a, #2a5a0a);
            border-radius: 60% 60% 30% 30% / 80% 80% 20% 20%;
        }

        /* Река */
        .river {
            position: absolute;
            background: linear-gradient(180deg, 
                #4a90d9 0%, 
                #3a70b9 20%, 
                #2a5a9a 50%, 
                #1a4a8a 80%, 
                #0a3a7a 100%);
            border-radius: 0;
            opacity: 0.9;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .river-shimmer {
            position: absolute;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255,255,255,0.3) 30%, 
                rgba(255,255,255,0.5) 50%, 
                rgba(255,255,255,0.3) 70%, 
                transparent 100%);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        /* Камни для сна */
        .rock-sleep {
            position: absolute;
            z-index: 4;
            background: linear-gradient(135deg, #8a8a7a, #5a5a4a);
            border-radius: 40% 40% 30% 30% / 50% 50% 30% 30%;
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.5),
                inset 0 -5px 15px rgba(0,0,0,0.3),
                inset 0 5px 15px rgba(255,255,255,0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .rock-sleep:hover {
            box-shadow: 
                0 15px 40px rgba(0,0,0,0.6),
                inset 0 -5px 15px rgba(0,0,0,0.3),
                inset 0 5px 15px rgba(255,255,255,0.2),
                0 0 30px rgba(255,200,100,0.3);
        }

        .rock-sleep.sleeping {
            box-shadow: 
                0 15px 40px rgba(0,0,0,0.6),
                0 0 50px rgba(255,200,100,0.5),
                inset 0 -5px 15px rgba(0,0,0,0.3);
            animation: rockGlow 1s ease-in-out infinite;
        }

        @keyframes rockGlow {
            0%, 100% { box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 40px rgba(255,200,100,0.3); }
            50% { box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 70px rgba(255,200,100,0.6); }
        }

        /* Камни обычные */
        .rock {
            position: absolute;
            z-index: 3;
            background: linear-gradient(135deg, #7a7a6a, #5a5a3a);
            border-radius: 30% 40% 35% 45%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4), inset 0 -3px 10px rgba(0,0,0,0.3);
        }

        /* Цветы */
        .flower {
            position: absolute;
            z-index: 3;
            font-size: 16px;
            pointer-events: none;
            animation: sway 2s ease-in-out infinite;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        /* Кусты */
        .bush {
            position: absolute;
            z-index: 3;
            background: radial-gradient(circle, #3a7a20, #1a4a0a);
            border-radius: 50% 60% 40% 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Тропа */
        .path {
            position: absolute;
            background: rgba(139, 105, 20, 0.4);
            border-radius: 10px;
            z-index: 1;
        }

        /* Персонаж */
        .character {
            position: absolute;
            z-index: 20;
            pointer-events: none;
            transition: all 0.15s ease-out;
            transform-origin: center bottom;
            width: 90px;
            height: 90px;
        }

        .character img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(4px 6px 4px rgba(0,0,0,0.5));
            image-rendering: auto;
        }

        /* Эмоции персонажа */
        .emotion-indicator {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            pointer-events: none;
            animation: emotionFloat 1.5s ease-in-out infinite;
            z-index: 21;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
        }

        @keyframes emotionFloat {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }

        .character.chasing {
            animation: chaseWiggle 0.3s infinite;
        }

        .character.eating {
            animation: nomNom 0.4s ease-in-out;
        }

        .character.angry img {
            animation: angryShake 0.5s infinite;
            filter: drop-shadow(4px 6px 4px rgba(255,0,0,0.7)) brightness(1.2) !important;
        }

        .character.hunting {
            animation: huntPounce 0.6s ease-out;
        }

        .character.sleeping {
            animation: sleepBreathe 2s ease-in-out infinite;
            filter: brightness(0.8) saturate(0.7);
        }

        .character.avoiding {
            animation: avoidShake 0.4s infinite;
        }

        .character.curious {
            animation: curiousTilt 1s ease-in-out infinite;
        }

        .character.annoyed {
            animation: annoyedFlick 0.2s infinite;
        }

        .character.flip img {
            transform: scaleX(-1);
        }

        @keyframes chaseWiggle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes nomNom {
            0% { transform: scale(1); }
            30% { transform: scale(1.3); }
            60% { transform: scale(0.85); }
            100% { transform: scale(1); }
        }

        @keyframes angryShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            75% { transform: translateX(10px) rotate(5deg); }
        }

        @keyframes huntPounce {
            0% { transform: scale(1); }
            40% { transform: scale(0.65, 1.25); }
            70% { transform: scale(1.35, 0.75) translateY(-40px); }
            100% { transform: scale(1) translateY(0); }
        }

        @keyframes sleepBreathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes avoidShake {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(15px); }
        }

        @keyframes curiousTilt {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-8deg); }
            75% { transform: rotate(8deg); }
        }

        @keyframes annoyedFlick {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-5px) rotate(-3deg); }
        }

        /* Добыча */
        .prey-emoji {
            position: absolute;
            font-size: 30px;
            pointer-events: auto;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.4));
        }

        .prey-emoji:hover {
            transform: scale(1.4);
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.6)) brightness(1.3);
        }

        .prey-emoji.fleeing {
            animation: flee 1.5s ease-out forwards;
            pointer-events: none;
        }

        .prey-emoji.caught {
            animation: caughtFade 0.5s forwards;
            pointer-events: none;
        }

        @keyframes flee {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--flee-x), var(--flee-y)) scale(0.3); opacity: 0; }
        }

        @keyframes caughtFade {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.3); }
            100% { opacity: 0; transform: scale(0) translateY(-50px); }
        }

        /* Мясо */
        .meat-piece {
            position: absolute;
            font-size: 28px;
            z-index: 9;
            pointer-events: auto;
            cursor: pointer;
            animation: meatDrop 0.5s ease-out;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5));
        }

        .meat-piece:hover {
            transform: scale(1.4);
            filter: drop-shadow(0 6px 6px rgba(0,0,0,0.7)) brightness(1.3);
        }

        @keyframes meatDrop {
            0% { transform: translateY(-60px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Лазер курсора */
        .cursor-laser {
            position: absolute;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 25px var(--accent), 0 0 50px var(--accent);
            display: none;
        }

        /* Панель статуса */
        .stats-panel {
            background: var(--panel);
            border-radius: 16px;
            padding: 15px 25px;
            border: 2px solid #2a1f0a;
            width: 100%;
            max-width: 1000px;
            display: flex;
            gap: 20px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .stat {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .stat-label {
            color: #aaa;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-bar {
            height: 10px;
            background: #2a2a4a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #3a3a5c;
        }

        .stat-fill {
            height: 100%;
            border-radius: 8px;
            transition: width 0.5s ease;
        }

        .stat-fill.hunger { background: linear-gradient(90deg, #e94560, #ff6b6b); }
        .stat-fill.energy { background: linear-gradient(90deg, #4ecdc4, #44bd9e); }
        .stat-fill.mood { background: linear-gradient(90deg, #ffd93d, #ff9f43); }

        .stat-value {
            color: var(--text);
            font-size: 13px;
            font-weight: bold;
        }

        /* Кнопки */
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #1a1a2e;
            color: var(--text);
            border: 2px solid #3a3a5c;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }

        .btn:hover {
            background: #2a2a5a;
            border-color: #5a5a8c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .btn.hunt-mode { border-color: #ff6b6b; background: #2a1018; }
        .btn.hunt-mode.active { border-color: #ff4444; background: #3a1020; box-shadow: 0 0 20px rgba(255,0,0,0.3); }

        /* Сообщения */
        .message-bubble {
            position: absolute;
            background: white;
            color: #1a1a2e;
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: bold;
            z-index: 30;
            pointer-events: none;
            animation: bubbleFloat 2.5s ease-out forwards;
            white-space: nowrap;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .message-bubble::after {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 7px solid white;
        }

        @keyframes bubbleFloat {
            0% { opacity: 0; transform: translateY(10px); }
            15% { opacity: 1; transform: translateY(-25px); }
            75% { opacity: 1; transform: translateY(-45px); }
            100% { opacity: 0; transform: translateY(-75px); }
        }

        /* Лог памяти */
        .memory-bar {
            background: var(--panel);
            border-radius: 12px;
            padding: 10px 18px;
            border: 1px solid #2a1f0a;
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            font-size: 11px;
            max-height: 60px;
            overflow-y: auto;
        }

        .memory-tag {
            background: #2a2a4a;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 10px;
            color: #aaa;
            white-space: nowrap;
        }

        .memory-tag.important {
            background: #3a1a2a;
            color: #ff6b6b;
            border: 1px solid #5a2a3a;
        }

        /* Подсказка */
        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.85);
            color: #ffd93d;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            pointer-events: none;
            z-index: 25;
            white-space: nowrap;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .title {
            color: var(--gold);
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(212, 167, 116, 0.5);
        }

        .fallback-emoji {
            font-size: 70px;
            display: none;
        }

        /* Мини-карта */
        .minimap {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 140px;
            height: 100px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #5a4a0a;
            border-radius: 8px;
            z-index: 50;
            pointer-events: none;
            overflow: hidden;
        }

        .minimap-view {
            position: absolute;
            border: 1px solid #ffd93d;
            background: rgba(255,215,55,0.1);
        }

        @media (max-width: 768px) {
            .game-world {
                height: 50vh;
            }
            .btn {
                padding: 8px 12px;
                font-size: 11px;
            }
            .stats-panel {
                padding: 10px 15px;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">🦁 Саванна — Надменный Лев</div>

        <!-- Игровой мир -->
        <div class="game-world" id="gameWorld">
            <div class="map-container" id="mapContainer">
                <!-- Карта генерируется через JS -->
            </div>
            <div class="character" id="character">
                <img src="FFF.png" alt="Лев" id="charImage" onerror="handleImageError()">
                <span class="fallback-emoji" id="fallbackEmoji">🦁</span>
                <div class="emotion-indicator" id="emotionIndicator"></div>
            </div>
            <div class="cursor-laser" id="cursorLaser"></div>
            <div class="minimap" id="minimap">
                <div class="minimap-view" id="minimapView"></div>
            </div>
        </div>

        <!-- Статус -->
        <div class="stats-panel">
            <div class="stat">
                <div class="stat-label">🍖 Голод</div>
                <div class="stat-bar"><div class="stat-fill hunger" id="hungerBar" style="width: 70%"></div></div>
                <div class="stat-value" id="hungerValue">70%</div>
            </div>
            <div class="stat">
                <div class="stat-label">⚡ Энергия</div>
                <div class="stat-bar"><div class="stat-fill energy" id="energyBar" style="width: 80%"></div></div>
                <div class="stat-value" id="energyValue">80%</div>
            </div>
            <div class="stat">
                <div class="stat-label">😾 Настроение</div>
                <div class="stat-bar"><div class="stat-fill mood" id="moodBar" style="width: 40%"></div></div>
                <div class="stat-value" id="moodValue">40%</div>
            </div>
        </div>

        <!-- Кнопки -->
        <div class="actions">
            <button class="btn" onclick="petLion()">✋ Погладить</button>
            <button class="btn" onclick="feedLion()">🍖 Покормить</button>
            <button class="btn" onclick="playWithLion()">🎾 Поиграть</button>
            <button class="btn hunt-mode" id="huntBtn" onclick="toggleHuntMode()">🎯 Охота</button>
            <button class="btn" onclick="goToSleepSpot()">💤 Спать на камнях</button>
        </div>

        <!-- Память -->
        <div class="memory-bar" id="memoryBar">
            <span style="color:#666;">Память:</span>
        </div>
    </div>

    <script>
        // ===== ОБРАБОТКА ОШИБКИ ИЗОБРАЖЕНИЯ =====
        function handleImageError() {
            document.getElementById('charImage').style.display = 'none';
            document.getElementById('fallbackEmoji').style.display = 'block';
        }

        // ===== КАРТА МИРА =====
        const mapContainer = document.getElementById('mapContainer');
        const mapWidth = 2400;
        const mapHeight = 1600;

        function generateMap() {
            let html = '<div class="terrain-layer"><div class="ground-savanna"></div>';

            // Трава (много пятен)
            const grassPositions = [
                {x: 100, y: 200, s: 180}, {x: 350, y: 350, s: 150}, {x: 600, y: 250, s: 200},
                {x: 900, y: 400, s: 170}, {x: 1200, y: 300, s: 220}, {x: 1500, y: 500, s: 160},
                {x: 1800, y: 350, s: 190}, {x: 2100, y: 450, s: 180}, {x: 200, y: 800, s: 200},
                {x: 500, y: 700, s: 175}, {x: 800, y: 900, s: 210}, {x: 1100, y: 750, s: 185},
                {x: 1400, y: 850, s: 195}, {x: 1700, y: 700, s: 170}, {x: 2000, y: 950, s: 200},
                {x: 100, y: 1100, s: 190}, {x: 400, y: 1200, s: 180}, {x: 700, y: 1150, s: 210},
                {x: 1000, y: 1300, s: 175}, {x: 1300, y: 1200, s: 195}, {x: 1600, y: 1100, s: 185},
                {x: 1900, y: 1300, s: 200}, {x: 2200, y: 1150, s: 190},
            ];
            grassPositions.forEach(g => {
                html += `<div class="grass-patch" style="left:${g.x}px;top:${g.y}px;width:${g.s}px;height:${g.s*0.7}px;"></div>`;
            });

            // Высокая трава
            for (let i = 0; i < 40; i++) {
                const tx = Math.random() * mapWidth;
                const ty = Math.random() * mapHeight;
                const tw = 60 + Math.random() * 120;
                html += `<div class="grass-tall" style="left:${tx}px;top:${ty}px;width:${tw}px;height:${tw*0.8}px;"></div>`;
            }

            // Деревья
            const treePositions = [
                {x: 150, y: 150, h: 160}, {x: 450, y: 100, h: 180}, {x: 750, y: 180, h: 150},
                {x: 1050, y: 120, h: 200}, {x: 1350, y: 160, h: 170}, {x: 1650, y: 100, h: 190},
