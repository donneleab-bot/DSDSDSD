<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFF - Надменный Лев</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel: #16213e;
            --text: #e0e0e0;
            --accent: #e94560;
            --gold: #d4a574;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        /* Игровая зона */
        .game-area {
            width: 700px;
            height: 500px;
            background: linear-gradient(180deg, 
                #87CEEB 0%, #87CEEB 15%,
                #4a8c2a 15%, #3a7a1a 18%,
                #2d5a18 18%, #1a3a0a 40%, 
                #8b6914 40%, #6b4f12 60%,
                #4a3508 60%, #3a2505 100%);
            border-radius: 24px;
            border: 3px solid #3a3a5c;
            position: relative;
            overflow: hidden;
            cursor: default;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* Деревья */
        .tree {
            position: absolute;
            z-index: 3;
            pointer-events: none;
        }
        .tree-trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            background: linear-gradient(180deg, #8B6914, #5a3a0a);
            border-radius: 3px;
        }
        .tree-crown {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 30%, #5a9a2a, #1a5a0a);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Трава */
        .grass-tuft {
            position: absolute;
            z-index: 2;
            pointer-events: none;
            font-size: 20px;
        }

        /* Река */
        .river {
            position: absolute;
            z-index: 1;
            background: linear-gradient(180deg, #5a9ad9, #3a7ab9, #2a5a9a);
            border-radius: 0 0 20px 20px;
            opacity: 0.8;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }
        .river-shine {
            position: absolute;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            animation: shineMove 4s ease-in-out infinite;
        }
        @keyframes shineMove {
            0%, 100% { opacity: 0.2; transform: translateX(0); }
            50% { opacity: 0.5; transform: translateX(15px); }
        }

        /* Камни */
        .rock {
            position: absolute;
            z-index: 2;
            background: linear-gradient(135deg, #9a9a8a, #6a6a5a);
            border-radius: 40% 35% 30% 45%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: all 0.3s;
        }
        .rock:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.6), 0 0 20px rgba(255,200,100,0.3);
        }
        .rock.sleep-spot {
            background: linear-gradient(135deg, #aaa89a, #7a7a6a);
            cursor: pointer;
        }
        .rock.sleep-spot:hover {
            box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 30px rgba(255,220,150,0.5);
        }

        /* Персонаж */
        .character {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            transition: all 0.15s ease-out;
            transform-origin: center bottom;
            width: 80px;
            height: 80px;
        }
        .character img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(3px 5px 3px rgba(0,0,0,0.4));
        }
        .character .emotion-badge {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            pointer-events: none;
            animation: emotionFloat 1.5s ease-in-out infinite;
        }
        @keyframes emotionFloat {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-6px); }
        }
        .character.chasing { animation: chaseWiggle 0.3s infinite; }
        .character.eating { animation: nomNom 0.4s ease-in-out; }
        .character.angry img { animation: angryShake 0.5s infinite; filter: drop-shadow(3px 5px 3px rgba(255,0,0,0.6)) brightness(1.2) !important; }
        .character.hunting { animation: huntPounce 0.6s ease-out; }
        .character.sleeping { animation: sleepBreathe 2s ease-in-out infinite; filter: brightness(0.8); }
        .character.avoiding { animation: avoidDodge 0.4s infinite; }
        .character.curious { animation: curiousTilt 1s ease-in-out infinite; }
        .character.annoyed { animation: annoyedFlick 0.25s infinite; }
        .character.flip img { transform: scaleX(-1); }

        @keyframes chaseWiggle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes nomNom {
            0% { transform: scale(1); }
            30% { transform: scale(1.25); }
            60% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        @keyframes angryShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px) rotate(-4deg); }
            75% { transform: translateX(8px) rotate(4deg); }
        }
        @keyframes huntPounce {
            0% { transform: scale(1); }
            40% { transform: scale(0.7, 1.2); }
            70% { transform: scale(1.3, 0.8) translateY(-30px); }
            100% { transform: scale(1) translateY(0); }
        }
        @keyframes sleepBreathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        @keyframes avoidDodge {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(15px); }
        }
        @keyframes curiousTilt {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-7deg); }
            75% { transform: rotate(7deg); }
        }
        @keyframes annoyedFlick {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-4px) rotate(-2deg); }
        }

        /* Добыча */
        .prey-emoji {
            position: absolute;
            font-size: 30px;
            pointer-events: auto;
            z-index: 5;
            cursor: pointer;
            animation: preyMove 6s ease-in-out infinite;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.4));
            transition: transform 0.2s;
        }
        .prey-emoji:hover { transform: scale(1.3); }
        .prey-emoji.caught {
            animation: caughtFade 0.5s forwards;
            pointer-events: none;
        }
        @keyframes preyMove {
            0% { transform: translate(0, 0); }
            25% { transform: translate(60px, -30px); }
            50% { transform: translate(30px, -15px); }
            75% { transform: translate(-40px, -35px); }
            100% { transform: translate(0, 0); }
        }
        @keyframes caughtFade {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0) translateY(-40px); }
        }

        /* Мясо */
        .meat-piece {
            position: absolute;
            font-size: 28px;
            z-index: 6;
            pointer-events: auto;
            cursor: pointer;
            animation: meatDrop 0.5s ease-out;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.5));
            transition: transform 0.2s;
        }
        .meat-piece:hover {
            transform: scale(1.35);
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.7)) brightness(1.3);
        }
        @keyframes meatDrop {
            0% { transform: translateY(-50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Курсор-лазер */
        .cursor-laser {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent);
            display: none;
        }

        /* Панель статуса */
        .stats-panel {
            background: var(--panel);
            border-radius: 16px;
            padding: 18px 25px;
            border: 2px solid #3a3a5c;
            width: 700px;
            display: flex;
            gap: 18px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .stat {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .stat-label {
            color: #aaa;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .stat-bar {
            height: 10px;
            background: #2a2a4a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #3a3a5c;
        }
        .stat-fill {
            height: 100%;
            border-radius: 8px;
            transition: width 0.5s ease;
        }
        .stat-fill.hunger { background: linear-gradient(90deg, #e94560, #ff6b6b); }
        .stat-fill.energy { background: linear-gradient(90deg, #4ecdc4, #44bd9e); }
        .stat-fill.mood { background: linear-gradient(90deg, #ffd93d, #ff9f43); }
        .stat-value {
            color: var(--text);
            font-size: 13px;
            font-weight: bold;
        }

        /* Кнопки */
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background: var(--panel);
            color: var(--text);
            border: 2px solid #3a3a5c;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .btn:hover {
            background: #2a2a5a;
            border-color: #5a5a8c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .btn:active { transform: translateY(0); box-shadow: none; }
        .btn.hunt-btn { border-color: #ff6b6b; background: #3a1020; }
        .btn.hunt-btn.active { border-color: #ff4444; background: #4a1525; box-shadow: 0 0 20px rgba(255,0,0,0.3); }
        .btn.sleep-btn { border-color: #ffd93d; }

        /* Сообщения */
        .message-bubble {
            position: absolute;
            background: white;
            color: #1a1a2e;
            padding: 8px 15px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: bold;
            z-index: 20;
            pointer-events: none;
            animation: bubbleFloat 2.2s ease-out forwards;
            white-space: nowrap;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .message-bubble::after {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 7px solid white;
        }
        @keyframes bubbleFloat {
            0% { opacity: 0; transform: translateY(10px); }
            15% { opacity: 1; transform: translateY(-20px); }
            75% { opacity: 1; transform: translateY(-40px); }
            100% { opacity: 0; transform: translateY(-70px); }
        }

        /* Память */
        .memory-log {
            background: var(--panel);
            border-radius: 10px;
            padding: 10px 18px;
            border: 1px solid #3a3a5c;
            width: 700px;
            max-height: 80px;
            overflow-y: auto;
            font-size: 11px;
            color: #888;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .memory-tag {
            background: #2a2a4a;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 10px;
            color: #aaa;
        }
        .memory-tag.warn {
            background: #3a1a2a;
            color: #ff6b6b;
            border: 1px solid #5a2a3a;
        }

        .title {
            color: var(--gold);
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(212, 167, 116, 0.5);
        }
        .fallback-emoji {
            font-size: 60px;
            display: none;
            position: absolute;
            top: 10px;
            left: 10px;
        }

        @media (max-width: 750px) {
            .game-area, .stats-panel, .memory-log { width: 95vw; }
            .btn { padding: 8px 12px; font-size: 11px; }
            .character { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">🦁 Надменный Лев — Саванна</div>

        <!-- Игровая зона -->
        <div class="game-area" id="gameArea">
            <!-- Декорации генерируются JS -->
            <div class="character" id="character">
                <img src="FFF.png" alt="Лев" id="charImage" onerror="handleImageError()">
                <span class="fallback-emoji" id="fallbackEmoji">🦁</span>
                <div class="emotion-badge" id="emotionBadge"></div>
            </div>
            <div class="cursor-laser" id="cursorLaser"></div>
        </div>

        <!-- Статус -->
        <div class="stats-panel">
            <div class="stat">
                <div class="stat-label">🍖 Голод</div>
                <div class="stat-bar"><div class="stat-fill hunger" id="hungerBar" style="width: 70%"></div></div>
                <div class="stat-value" id="hungerValue">70%</div>
            </div>
            <div class="stat">
                <div class="stat-label">⚡ Энергия</div>
                <div class="stat-bar"><div class="stat-fill energy" id="energyBar" style="width: 80%"></div></div>
                <div class="stat-value" id="energyValue">80%</div>
            </div>
            <div class="stat">
                <div class="stat-label">😾 Настроение</div>
                <div class="stat-bar"><div class="stat-fill mood" id="moodBar" style="width: 40%"></div></div>
                <div class="stat-value" id="moodValue">40%</div>
            </div>
        </div>

        <!-- Кнопки -->
        <div class="actions">
            <button class="btn" onclick="petLion()">✋ Погладить</button>
            <button class="btn" onclick="feedLion()">🍖 Покормить</button>
            <button class="btn" onclick="playWithLion()">🎾 Поиграть</button>
            <button class="btn hunt-btn" id="huntBtn" onclick="toggleHuntMode()">🎯 Охота</button>
            <button class="btn sleep-btn" onclick="goToSleepSpot()">💤 Спать</button>
        </div>

        <!-- Память -->
        <div class="memory-log" id="memoryLog">
            <span style="color:#666;">Память FFF:</span>
        </div>
    </div>

    <script>
        // ===== ОБРАБОТКА ОШИБКИ ИЗОБРАЖЕНИЯ =====
        function handleImageError() {
            document.getElementById('charImage').style.display = 'none';
            document.getElementById('fallbackEmoji').style.display = 'block';
            console.warn('FFF.png не найден. Использую эмодзи.');
        }

        // ===== ГЕНЕРАЦИЯ КАРТЫ =====
        function buildMap() {
            const area = document.getElementById('gameArea');
            
            // Деревья
            const trees = [
                {x: 40, y: 60, h: 140}, {x: 150, y: 30, h: 120}, {x: 580, y: 50, h: 150},
                {x: 500, y: 80, h: 110}, {x: 300, y: 20, h: 130}, {x: 650, y: 40, h: 125},
            ];
            trees.forEach(t => {
                const tree = document.createElement('div');
                tree.className = 'tree';
                tree.style.cssText = `left:${t.x}px;top:${t.y}px;width:${t.h*0.7}px;height:${t.h}px;`;
                tree.innerHTML = `
                    <div class="tree-trunk" style="height:${t.h*0.4}px;"></div>
                    <div class="tree-crown" style="width:${t.h*0.6}px;height:${t.h*0.55}px;top:0;left:50%;transform:translateX(-50%);"></div>
                `;
                area.appendChild(tree);
            });

            // Трава
            const grassTufts = ['🌿', '🌱', '🪨', '🌾'];
            for (let i = 0; i < 25; i++) {
                const g = document.createElement('div');
                g.className = 'grass-tuft';
                g.textContent = grassTufts[Math.floor(Math.random() * grassTufts.length)];
                g.style.left = (Math.random() * 650) + 'px';
                g.style.top = (Math.random() * 420 + 30) + 'px';
                g.style.opacity = 0.6 + Math.random() * 0.4;
                area.appendChild(g);
            }

            // Река
            const river = document.createElement('div');
            river.className = 'river';
            river.style.cssText = 'left:300px;top:250px;width:80px;height:250px;';
            area.appendChild(river);
            
            const shine1 = document.createElement('div');
            shine1.className = 'river-shine';
            shine1.style.cssText = 'left:310px;top:280px;width:40px;height:8px;';
            area.appendChild(shine1);
            
            const shine2 = document.createElement('div');
            shine2.className = 'river-shine';
            shine2.style.cssText = 'left:315px;top:380px;width:35px;height:8px;animation-delay:2s;';
            area.appendChild(shine2);

            // Камни (включая спальные)
            const rocks = [
                {x: 120, y: 350, w: 70, h: 45, sleep: true},
                {x: 550, y: 300, w: 80, h: 50, sleep: true},
                {x: 400, y: 420, w: 60, h: 38, sleep: false},
                {x: 200, y: 400, w: 45, h: 30, sleep: false},
                {x: 620, y: 380, w: 55, h: 35, sleep: false},
            ];
            rocks.forEach((r, i) => {
                const rock = document.createElement('div');
                rock.className = 'rock' + (r.sleep ? ' sleep-spot' : '');
                rock.style.cssText = `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;`;
                if (r.sleep) {
                    rock.addEventListener('click', (e) => {
                        e.stopPropagation();
                        sleepOnRock(i);
                    });
                }
                area.appendChild(rock);
            });
        }

        // ===== СОСТОЯНИЕ ПЕРСОНАЖА =====
        const state = {
            hunger: 70,
            energy: 80,
            mood: 40,
            huntMode: false,
            chasingCursor: false,
            isSleeping: false,
            emotion: '😼',
            memory: [],
            preyList: [],
            meatPieces: [],
        };

        // ===== DOM ЭЛЕМЕНТЫ =====
        const gameArea = document.getElementById('gameArea');
        const character = document.getElementById('character');
        const emotionBadge = document.getElementById('emotionBadge');
        const cursorLaser = document.getElementById('cursorLaser');
        const huntBtn = document.getElementById('huntBtn');
        const memoryLog = document.getElementById('memoryLog');

        let charX = 300, charY = 250;
        let targetX = 300, targetY = 250;
        let mouseX = 350, mouseY = 250;
        let animationFrame;
        let sleepTimeout;

        // ===== ЭМОЦИИ =====
        function setEmotion(emoji) {
            state.emotion = emoji;
            emotionBadge.textContent = emoji;
        }

        function updateEmotionByMood() {
            character.classList.remove('angry', 'avoiding', 'curious', 'annoyed', 'sleeping');
            
            if (state.isSleeping) {
                character.classList.add('sleeping');
                setEmotion('💤');
                return;
            }
            
            if (state.mood >= 80) {
                setEmotion('😸');
                character.classList.add('curious');
            } else if (state.mood >= 60) {
                setEmotion('😼');
            } else if (state.mood >= 40) {
                setEmotion('😾');
                if (state.mood <= 50) character.classList.add('avoiding');
            } else if (state.mood >= 20) {
                setEmotion('😡');
                character.classList.add('annoyed');
                character.classList.add('avoiding');
            } else {
                setEmotion('🤬');
                character.classList.add('angry');
                character.classList.add('avoiding');
            }
            
            if (state.hunger > 80 && state.mood < 50) {
                setEmotion('😤');
                character.classList.add('angry');
            }
            if (state.energy < 20) {
                setEmotion('😩');
            }
        }

        // ===== СТАТУСЫ =====
        function updateStats() {
            state.hunger = Math.max(0, Math.min(100, state.hunger));
            state.energy = Math.max(0, Math.min(100, state.energy));
            state.mood = Math.max(0, Math.min(100, state.mood));

            document.getElementById('hungerBar').style.width = state.hunger + '%';
            document.getElementById('energyBar').style.width = state.energy + '%';
            document.getElementById('moodBar').style.width = state.mood + '%';
            document.getElementById('hungerValue').textContent = Math.round(state.hunger) + '%';
            document.getElementById('energyValue').textContent = Math.round(state.energy) + '%';
            document.getElementById('moodValue').textContent = Math.round(state.mood) + '%';

            updateEmotionByMood();

            // Поведение при настроении ≤ 50 — избегание курсора
            if (state.mood <= 50 && !state.isSleeping && !state.huntMode) {
                const dx = mouseX - charX;
                const dy = mouseY - charY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 100 && !state.chasingCursor) {
                    targetX = charX - (dx/dist) * 120;
                    targetY = charY - (dy/dist) * 120;
                    if (!state.memory.includes('избегает')) {
                        addMemory('😒 избегает внимания', true);
                        showMessage('Уйди...', charX, charY - 30);
                    }
                }
            }

            // Голодный и злой — гоняется за курсором
            if (state.hunger > 80 && state.mood < 30 && state.energy > 25 && !state.isSleeping && !state.huntMode) {
                startChasingCursor();
            }
        }

        // ===== ПАМЯТЬ =====
        function addMemory(action, isWarn = false) {
            const time = new Date().toLocaleTimeString();
            const entry = `${time}: ${action}`;
            if (state.memory.length > 0 && state.memory[state.memory.length-1].includes(action)) return;
            state.memory.push(entry);
            if (state.memory.length > 20) state.memory.shift();
            
            memoryLog.innerHTML = '<span style="color:#666;">Память:</span> ' + 
                state.memory.slice(-8).map(m => 
                    `<span class="memory-tag${isWarn ? ' warn' : ''}">${m}</span>`
                ).join('');
        }

        // ===== СООБЩЕНИЯ =====
        function showMessage(text, x, y) {
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;
            bubble.style.left = Math.max(10, Math.min(600, x)) + 'px';
            bubble.style.top = Math.max(20, y) + 'px';
            gameArea.appendChild(bubble);
            setTimeout(() => bubble.remove(), 2200);
        }

        // ===== ДВИЖЕНИЕ =====
        function moveCharacter() {
            const maxX = 620, maxY = 420, minX = 10, minY = 40;

            if (state.chasingCursor && !state.isSleeping) {
                targetX = mouseX - 40;
                targetY = mouseY - 45;
            }

            targetX = Math.max(minX, Math.min(maxX, targetX));
            targetY = Math.max(minY, Math.min(maxY, targetY));

            const speed = state.isSleeping ? 0 : (state.chasingCursor ? 0.1 : 0.05);
            charX += (targetX - charX) * speed;
            charY += (targetY - charY) * speed;

            const dx = targetX - charX;
            if (Math.abs(dx) > 2) {
                if (dx > 0) character.classList.remove('flip');
                else character.classList.add('flip');
            }

            character.style.left = charX + 'px';
            character.style.top = charY + 'px';

            cursorLaser.style.display = state.chasingCursor ? 'block' : 'none';
            if (state.chasingCursor) {
                cursorLaser.style.left = (mouseX - 6) + 'px';
                cursorLaser.style.top = (mouseY - 6) + 'px';
            }

            animationFrame = requestAnimationFrame(moveCharacter);
        }

        // ===== ПОГОНЯ =====
        function startChasingCursor() {
            if (state.chasingCursor || state.isSleeping) return;
            state.chasingCursor = true;
            character.classList.add('chasing');
            addMemory('🏃 гонится!', true);
            showMessage('ХВАТИТ!', charX, charY - 30);
        }

        function stopChasingCursor() {
            state.chasingCursor = false;
            character.classList.remove('chasing');
            cursorLaser.style.display = 'none';
        }

        // ===== СОН =====
        function goToSleepSpot() {
            if (state.isSleeping) {
                wakeUp();
                return;
            }
            if (state.energy > 80) {
                showMessage('Не хочу спать!', charX, charY - 30);
                return;
            }
            
            // Идём к спальному камню
            targetX = 120;
            targetY = 340;
            state.isSleeping = true;
            character.classList.add('sleeping');
            setEmotion('💤');
            stopChasingCursor();
            addMemory('💤 уснул на камнях');
            showMessage('Zzz... наконец-то', charX, charY - 30);
            
            sleepTimeout = setTimeout(wakeUp, 15000);
            document.querySelector('.btn.sleep-btn').textContent = '☀️ Проснуться';
        }

        function sleepOnRock(index) {
            const positions = [{x: 120, y: 340}, {x: 550, y: 290}];
            if (index < positions.length) {
                targetX = positions[index].x;
                targetY = positions[index].y;
            }
            goToSleepSpot();
        }

        function wakeUp() {
            state.isSleeping = false;
            character.classList.remove('sleeping');
            state.energy = Math.min(100, state.energy + 40);
            state.mood = Math.min(100, state.mood + 15);
            clearTimeout(sleepTimeout);
            addMemory('☀️ проснулся');
            showMessage('Ну ладно, встаю...', charX, charY - 30);
            document.querySelector('.btn.sleep-btn').textContent = '💤 Спать';
            updateStats();
        }

        // ===== ОХОТА =====
        const preyEmojis = ['🐔', '🐑', '🐇', '🦆', '🐟', '🐖', '🐄', '🦌'];

        function spawnPrey() {
            if (!state.huntMode || state.isSleeping) return;
            if (state.preyList.length >= 5) return;

            const prey = document.createElement('div');
            prey.className = 'prey-emoji';
            prey.textContent = preyEmojis[Math.floor(Math.random() * preyEmojis.length)];
            prey.style.left = (Math.random() * 600 + 20) + 'px';
            prey.style.top = (Math.random() * 380 + 40) + 'px';
            prey.style.animationDuration = (5 + Math.random() * 6) + 's';
            
            prey.addEventListener('click', (e) => {
                e.stopPropagation();
                catchPrey(prey);
            });
            
            gameArea.appendChild(prey);
            state.preyList.push(prey);

            setTimeout(() => {
                if (prey.parentNode && !prey.classList.contains('caught')) {
                    prey.remove();
                    state.preyList = state.preyList.filter(p => p !== prey);
                }
            }, 12000);
        }

        function catchPrey(preyElement) {
            if (!state.huntMode || preyElement.classList.contains('caught') || state.isSleeping) return;
            
            preyElement.classList.add('caught');
            character.classList.add('hunting');
            
            const meat = document.createElement('div');
            meat.className = 'meat-piece';
            meat.textContent = '🥩';
            meat.style.left = preyElement.style.left;
            meat.style.top = preyElement.style.top;
            meat.addEventListener('click', (e) => {
                e.stopPropagation();
                eatMeat(meat);
            });
            
            gameArea.appendChild(meat);
            state.meatPieces.push(meat);
            
            setTimeout(() => {
                preyElement.remove();
                state.preyList = state.preyList.filter(p => p !== preyElement);
            }, 500);

            const ml = parseFloat(meat.style.left);
            const mt = parseFloat(meat.style.top);
            targetX = ml;
            targetY = mt;
            
            state.mood = Math.min(100, state.mood + 15);
            addMemory('🎯 поймал!');
            showMessage('Попался!', ml, mt - 25);
            
            setTimeout(() => character.classList.remove('hunting'), 600);
            updateStats();
        }

        function eatMeat(meatElement) {
            if (!meatElement.parentNode || state.isSleeping) return;
            
            const ml = parseFloat(meatElement.style.left);
            const mt = parseFloat(meatElement.style.top);
            targetX = ml;
            targetY = mt;
            
            setTimeout(() => {
                character.classList.add('eating');
                meatElement.remove();
                state.meatPieces = state.meatPieces.filter(m => m !== meatElement);
                
                state.hunger = Math.max(0, state.hunger - 25);
                state.energy = Math.min(100, state.energy + 10);
                state.mood = Math.min(100, state.mood + 10);
                
                addMemory('🍖 съел мясо');
                showMessage('Вкусно!', ml, mt - 25);
                updateStats();
                
                setTimeout(() => character.classList.remove('eating'), 400);
            }, 300);
        }

        function toggleHuntMode() {
            if (state.isSleeping) {
                showMessage('Zzz... сплю', charX, charY - 30);
                return;
            }
            
            state.huntMode = !state.huntMode;
            
            if (state.huntMode) {
                huntBtn.textContent = '🔴 Охота ON';
                huntBtn.classList.add('active');
                stopChasingCursor();
                addMemory('🔫 охота!');
                showMessage('Время охоты!', charX, charY - 30);
                state.huntInterval = setInterval(spawnPrey, 2500);
                spawnPrey();
            } else {
                huntBtn.textContent = '🎯 Охота';
                huntBtn.classList.remove('active');
                clearInterval(state.huntInterval);
                state.preyList.forEach(p => p.remove());
                state.preyList = [];
                state.meatPieces.forEach(m => m.remove());
                state.meatPieces = [];
                addMemory('💤 охота кончилась');
                updateStats();
            }
        }

        // ===== ВЗАИМОДЕЙСТВИЯ =====
        function petLion() {
            if (state.isSleeping) {
                showMessage('Zzz...', charX, charY - 30);
                return;
            }
            if (state.mood < 30) {
                showMessage('НЕ ТРОГАЙ! *убегает*', charX, charY - 30);
                targetX = charX + (Math.random() - 0.5) * 180;
                targetY = charY + (Math.random() - 0.5) * 120;
                state.mood = Math.max(0, state.mood - 10);
                addMemory('😡 ударил за ласку', true);
            } else if (state.mood < 60) {
                showMessage('Ладно... один раз', charX, charY - 30);
                state.mood = Math.min(100, state.mood + 5);
                state.energy = Math.max(0, state.energy - 5);
                addMemory('🙄 потерпел ласку');
            } else {
                showMessage('Мрр... ещё?', charX, charY - 30);
                state.mood = Math.min(100, state.mood + 8);
                addMemory('😸 понравилось!');
            }
            updateStats();
        }

        function feedLion() {
            if (state.isSleeping) {
                showMessage('Zzz...', charX, charY - 30);
                return;
            }
            const meat = document.createElement('div');
            meat.className = 'meat-piece';
            meat.textContent = '🥩';
            meat.style.left = (charX + 25) + 'px';
            meat.style.top = (charY + 25) + 'px';
            meat.addEventListener('click', (e) => {
                e.stopPropagation();
                eatMeat(meat);
            });
            gameArea.appendChild(meat);
            state.meatPieces.push(meat);
            showMessage('Держи мясо', charX, charY - 30);
            addMemory('🍖 получил мясо');
            
            setTimeout(() => {
                if (meat.parentNode) eatMeat(meat);
            }, 2000);
        }

        function playWithLion() {
            if (state.isSleeping) {
                showMessage('Zzz...', charX, charY - 30);
                return;
            }
            if (state.energy < 15) {
                showMessage('Устал...', charX, charY - 30);
                addMemory('😴 отказался играть');
                return;
            }
            targetX = Math.random() * 550 + 30;
            targetY = Math.random() * 350 + 50;
            state.energy = Math.max(0, state.energy - 15);
            state.mood = Math.min(100, state.mood + (state.mood < 50 ? 5 : 12));
            showMessage('Ладно, догоняй!', charX, charY - 30);
            addMemory('🎾 поиграл');
            updateStats();
        }

        // ===== ОТСЛЕЖИВАНИЕ МЫШИ =====
        gameArea.addEventListener('mousemove', (e) => {
            const rect = gameArea.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        gameArea.addEventListener('mouseleave', () => {
            if (state.chasingCursor && !state.huntMode) stopChasingCursor();
        });

        gameArea.addEventListener('click', (e) => {
            if ((e.target === gameArea || e.target.classList.contains('river') || 
                 e.target.classList.contains('river-shine') || e.target.classList.contains('grass-tuft')) && 
                state.chasingCursor && !state.huntMode) {
                stopChasingCursor();
                showMessage('Надоело...', charX, charY - 30);
            }
        });

        // ===== ПАССИВНЫЕ ЭФФЕКТЫ =====
        setInterval(() => {
            if (state.isSleeping) {
                state.energy = Math.min(100, state.energy + 1.5);
                state.hunger = Math.min(100, state.hunger + 0.15);
                state.mood = Math.min(100, state.mood + 0.3);
                updateStats();
                return;
            }
            
            state.hunger = Math.min(100, state.hunger + 0.6);
            
            if (!state.huntMode && !state.chasingCursor) {
                state.energy = Math.min(100, state.energy + 0.25);
            }
            if (state.huntMode) {
                state.energy = Math.max(0, state.energy - 0.4);
            }
            if (state.chasingCursor) {
                state.energy = Math.max(0, state.energy - 0.35);
            }
            
            if (state.hunger > 70) state.mood = Math.max(0, state.mood - 0.3);
            if (state.energy < 15) state.mood = Math.max(0, state.mood - 0.4);
            
            if (state.hunger > 85 && !state.chasingCursor && state.energy > 20 && !state.isSleeping && state.mood < 35) {
                startChasingCursor();
            }
            if (state.energy < 5 && state.chasingCursor) {
                stopChasingCursor();
                showMessage('Выдохся...', charX, charY - 30);
            }
            
            updateStats();
        }, 2000);

        // ===== СТАРТ =====
        function init() {
            buildMap();
            character.style.left = charX + 'px';
            character.style.top = charY + 'px';
            setEmotion('😼');
            moveCharacter();
            addMemory('👑 появился');
            updateStats();
            
            setTimeout(() => showMessage('Что смотришь?', charX, charY - 30), 1500);
            setTimeout(() => showMessage('Я тут главный.', charX + 20, charY - 45), 3500);
        }

        window.addEventListener('beforeunload', () => {
            try {
                sessionStorage.setItem('fff_data', JSON.stringify({
                    hunger: state.hunger, energy: state.energy, mood: state.mood,
                    memory: state.memory.slice(-10)
                }));
            } catch(e) {}
        });

        // Загрузка сохранения
        try {
            const saved = sessionStorage.getItem('fff_data');
            if (saved) {
                const data = JSON.parse(saved);
                state.hunger = data.hunger || 70;
                state.energy = data.energy || 80;
                state.mood = data.mood || 40;
                if (data.memory) state.memory = data.memory;
                memoryLog.innerHTML = '<span style="color:#666;">Память:</span> ' + 
                    state.memory.slice(-8).map(m => `<span class="memory-tag">${m}</span>`).join('');
            }
        } catch(e) {}

        init();
        console.log('🦁 FFF готов! Карта загружена, лев на месте.');
    </script>
</body>
</html>
